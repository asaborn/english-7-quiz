/* VOICE everyday study app for a 12-year-old: friendly, clear and encouraging, never babyish

<body>
<div id="app"></div>

<template id="learn-pos">
<section class="lsec">
  <h3>Every word has a job</h3>
  <p>In a sentence, every word has a job. We call the job its <b>part of speech</b>. For your quiz you need three of them.</p>
  <p class="demo">The <span class="hl a">happy</span> <span class="hl n">girl</span> <span class="hl v">reads</span> a <span class="hl a">new</span> <span class="hl n">book</span>.</p>
  <div class="keys"><span class="hl n">noun</span><span class="hl v">verb</span><span class="hl a">adjective</span></div>
</section>
<section class="lsec">
  <h3><span class="hl n">Nouns</span></h3>
  <p>A noun is a <b>person</b>, an <b>animal</b>, a <b>place</b>, a <b>thing</b> or an <b>idea</b>.</p>
  <div class="scroll"><table class="tbl kv"><tbody>
    <tr><th>People</th><td>teacher, girl, Dana, mother</td></tr>
    <tr><th>Animals</th><td>dog, horse, bird</td></tr>
    <tr><th>Places</th><td>school, park, Haifa</td></tr>
    <tr><th>Things</th><td>phone, book, table</td></tr>
    <tr><th>Ideas, feelings</th><td>love, friendship, happiness</td></tr>
  </tbody></table></div>
  <ul class="tips">
    <li>You can put <b>a</b>, <b>an</b> or <b>the</b> before most nouns: a book, an apple, the park.</li>
    <li>Most nouns have a plural: one book → two books, a box → two boxes, a child → children.</li>
    <li>Names of people and places start with a capital letter: Dana, Israel, London.</li>
  </ul>
</section>
<section class="lsec">
  <h3><span class="hl v">Verbs</span></h3>
  <p>A verb tells us what someone <b>does</b> (an action), or what someone <b>is</b>, <b>has</b> or <b>thinks</b> (a state).</p>
  <div class="scroll"><table class="tbl kv"><tbody>
    <tr><th>Actions</th><td>run, eat, play, write, swim, read</td></tr>
    <tr><th>States</th><td>be (am, is, are), have, like, know, think</td></tr>
  </tbody></table></div>
  <ul class="tips">
    <li>You can put <b>I</b>, <b>you</b>, <b>we</b> or <b>they</b> before a verb: I swim, they eat.</li>
    <li>Verbs change with the subject and the time: I play, she plays, they are playing.</li>
    <li><b>am</b>, <b>is</b> and <b>are</b> are verbs too!</li>
  </ul>
</section>
<section class="lsec">
  <h3><span class="hl a">Adjectives</span></h3>
  <p>An adjective <b>describes a noun</b>. It tells us what someone or something is like.</p>
  <div class="scroll"><table class="tbl kv"><tbody>
    <tr><th>Size</th><td>big, small, tall, long</td></tr>
    <tr><th>Color</th><td>red, blue, black, white</td></tr>
    <tr><th>Feelings</th><td>happy, sad, angry, bored</td></tr>
    <tr><th>Opinion</th><td>beautiful, funny, boring, nice</td></tr>
  </tbody></table></div>
  <h4>Three rules</h4>
  <ol class="tips">
    <li>The adjective comes <b>before</b> the noun.<br><span class="ex yes">a red car</span><span class="ex no">a car red</span></li>
    <li>Or it comes <b>after be</b> (am, is, are).<br><span class="ex yes">The car is red.</span><span class="ex yes">My sister is happy.</span></li>
    <li>Adjectives <b>never take -s</b>.<br><span class="ex yes">two red cars</span><span class="ex no">two reds cars</span><span class="ex yes">They are tall.</span><span class="ex no">They are talls.</span></li>
  </ol>
  <p class="tip">Test it: can you put <b>very</b> before the word? Very happy, very cold: adjectives. Very book? No, book is a noun.</p>
</section>
<section class="lsec">
  <h3>One word, two jobs</h3>
  <p>Some words can be a noun <b>or</b> a verb. Look at the words around them.</p>
  <div class="pairs">
    <p>I <span class="hl v">play</span> football. <em>verb</em></p><p>We saw a <span class="hl n">play</span> at school. <em>noun</em></p>
    <p>They <span class="hl v">walk</span> to school. <em>verb</em></p><p>Let's go for a <span class="hl n">walk</span>. <em>noun</em></p>
    <p>I <span class="hl v">drink</span> milk. <em>verb</em></p><p>Can I have a <span class="hl n">drink</span>? <em>noun</em></p>
  </div>
  <p class="tip">After <b>a / an / the</b> → a noun. After <b>I / you / we / they</b> → a verb.</p>
</section>
<section class="lsec">
  <h3>Word endings that help</h3>
  <ul class="tips">
    <li>Nouns often end in <b>-ness</b> (happiness), <b>-tion</b> (information), <b>-ment</b> (movement), or <b>-er</b> for people (teacher, player).</li>
    <li>Adjectives often end in <b>-ful</b> (beautiful), <b>-y</b> (sunny, funny) or <b>-ous</b> (famous).</li>
    <li>Careful: not every <b>-ing</b> word is a verb. In “The movie is boring”, <b>boring</b> is an adjective.</li>
  </ul>
</section>
</template>

<template id="learn-tense">
<section class="lsec">
  <h3>The verb <span class="hl v">be</span>: am, is, are</h3>
  <div class="scroll"><table class="tbl">
    <thead><tr><th></th><th>Positive</th><th>Negative</th></tr></thead>
    <tbody>
      <tr><th>I</th><td>I am (I'm)</td><td>I am not (I'm not)</td></tr>
      <tr><th>He / She / It</th><td>is (he's)</td><td>is not (isn't)</td></tr>
      <tr><th>You / We / They</th><td>are (we're)</td><td>are not (aren't)</td></tr>
    </tbody></table></div>
  <p>I'm twelve years old. My dad isn't at home. We aren't tired.</p>
  <div class="watch"><span class="wt">Watch out</span>With be, never use don't or doesn't.<br>
    <span class="ex no">I don't hungry.</span><span class="ex no">I don't am hungry.</span><span class="ex yes">I'm not hungry.</span><br>
    There is no “amn't”. Say <b>I'm not</b>.</div>
</section>
<section class="lsec">
  <h3>Present Simple</h3>
  <p>For things that happen <b>always, usually or every day</b>: habits, routines and facts.</p>
  <div class="scroll"><table class="tbl">
    <thead><tr><th></th><th>Positive</th><th>Negative</th></tr></thead>
    <tbody>
      <tr><th>I / You / We / They</th><td>I play</td><td>I don't play</td></tr>
      <tr><th>He / She / It</th><td>she plays</td><td>she doesn't play</td></tr>
    </tbody></table></div>
  <div class="watch"><span class="wt">Watch out</span>After don't / doesn't, the verb has <b>no -s</b>.<br>
    <span class="ex yes">She doesn't play.</span><span class="ex no">She doesn't plays.</span><span class="ex no">She don't play.</span></div>
  <h4>Spelling with he / she / it</h4>
  <div class="scroll"><table class="tbl kv"><tbody>
    <tr><th>most verbs: + s</th><td>play → plays, read → reads</td></tr>
    <tr><th>-sh, -ch, -ss, -x, -o: + es</th><td>wash → washes, watch → watches, miss → misses, fix → fixes, go → goes, do → does</td></tr>
    <tr><th>consonant + y: y → ies</th><td>study → studies, cry → cries, fly → flies</td></tr>
    <tr><th>vowel + y: + s</th><td>play → plays, buy → buys</td></tr>
    <tr><th>have</th><td>have → has</td></tr>
  </tbody></table></div>
  <p class="tip">Time words: always, usually, often, sometimes, never, every day, every week, on Mondays, at night, twice a day.</p>
  <p class="tip">always, usually, often, sometimes and never go <b>before</b> the main verb (She always walks to school), but <b>after</b> be (She is always late).</p>
</section>
<section class="lsec">
  <h3>Present Progressive</h3>
  <p>For things that are happening <b>now</b>, at this moment.</p>
  <p class="formula">am / is / are + verb-ing</p>
  <div class="scroll"><table class="tbl">
    <thead><tr><th></th><th>Positive</th><th>Negative</th></tr></thead>
    <tbody>
      <tr><th>I</th><td>I'm reading.</td><td>I'm not reading.</td></tr>
      <tr><th>He / She / It</th><td>He's sleeping.</td><td>He isn't sleeping.</td></tr>
      <tr><th>You / We / They</th><td>They're playing.</td><td>They aren't playing.</td></tr>
    </tbody></table></div>
  <h4>Spelling of -ing</h4>
  <div class="scroll"><table class="tbl kv"><tbody>
    <tr><th>most verbs: + ing</th><td>play → playing, read → reading, study → studying</td></tr>
    <tr><th>e at the end: drop the e</th><td>write → writing, dance → dancing, make → making</td></tr>
    <tr><th>short verb, consonant + vowel + consonant: double the last letter</th><td>swim → swimming, run → running, sit → sitting, get → getting</td></tr>
    <tr><th>ie → y</th><td>lie → lying</td></tr>
  </tbody></table></div>
  <p class="tip">Time words: now, right now, at the moment, today, this week. Also: Look! Listen! Be quiet!</p>
  <div class="watch"><span class="wt">Watch out</span>Don't forget am / is / are, and use verb-ing after them.<br>
    <span class="ex no">She reading a book.</span><span class="ex no">She is reads a book.</span><span class="ex yes">She is reading a book.</span></div>
</section>
<section class="lsec">
  <h3>Simple or Progressive?</h3>
  <div class="two">
    <div><h4>Present Simple</h4><p>always, usually, every day: habits and facts</p><p><b>I walk to school every day.</b><br><b>The sun rises in the east.</b></p></div>
    <div><h4>Present Progressive</h4><p>now, at the moment, Look!: happening right now</p><p><b>Today I'm going by bus.</b><br><b>Look! The sun is rising.</b></p></div>
  </div>
  <p class="demo">Dan usually <span class="hl v">plays</span> football on Fridays, but today he <span class="hl v">is playing</span> basketball.</p>
</section>
</template>

<template id="learn-stative">
<section class="lsec">
  <h3>Action verbs and stative verbs</h3>
  <p>Most verbs are <b>action verbs</b>. You can see the action: run, eat, write, swim.</p>
  <p><b>Stative verbs</b> describe a <b>state</b>: what we think, feel, know or believe. There is no action you can see.</p>
  <div class="keys"><span class="hl o">think</span><span class="hl o">feel</span><span class="hl o">understand</span><span class="hl o">believe</span></div>
  <p>More stative verbs: know, like, love, hate, want, need, remember.</p>
  <p class="tip">Quick test: can you take a photo of it? Someone running: yes, that's an action. Someone understanding: no, that's a state.</p>
</section>
<section class="lsec">
  <h3>The big rule</h3>
  <p>We <b>don't use stative verbs with -ing</b> (Present Progressive). We use the <b>Present Simple</b>, even when we talk about now!</p>
  <div class="pairs">
    <p><span class="ex yes">I understand the question now.</span></p><p><span class="ex no">I am understanding the question now.</span></p>
    <p><span class="ex yes">She believes you.</span></p><p><span class="ex no">She is believing you.</span></p>
    <p><span class="ex yes">I think it's a great idea.</span></p><p><span class="ex no">I am thinking it's a great idea.</span></p>
    <p><span class="ex yes">He knows the answer.</span></p><p><span class="ex no">He is knowing the answer.</span></p>
    <p><span class="ex yes">I need help right now.</span></p><p><span class="ex no">I am needing help right now.</span></p>
  </div>
</section>
<section class="lsec">
  <h3>Positive and negative</h3>
  <div class="scroll"><table class="tbl">
    <thead><tr><th></th><th>Positive</th><th>Negative</th></tr></thead>
    <tbody>
      <tr><th>I / You / We / They</th><td>I understand</td><td>I don't understand</td></tr>
      <tr><th>He / She / It</th><td>she understands</td><td>she doesn't understand</td></tr>
    </tbody></table></div>
  <p>I don't understand this word. My dad doesn't believe in luck. She feels happy today.</p>
</section>
<section class="lsec">
  <h3>Watch out: think and feel</h3>
  <div class="two">
    <div><h4>think</h4>
      <p><b>I think</b> = I believe, it's my opinion → Present Simple.<br><span class="ex yes">I think English is fun.</span></p>
      <p><b>think about</b> = my brain is working on it right now → -ing is OK.<br><span class="ex yes">Shh! I'm thinking about the answer.</span></p></div>
    <div><h4>feel</h4>
      <p>On your quiz, use the Present Simple with feel.<br><span class="ex yes">I feel tired.</span><span class="ex yes">She feels happy today.</span></p>
      <p class="small">In everyday English you may also hear “I'm feeling tired”, but on the quiz stick to the Present Simple.</p></div>
  </div>
</section>
</template>

const APOS = /[‘’‛ʼ`´′]/g;
function base(s) {
  return String(s == null ? "" : s).toLowerCase()
    .replace(APOS, "'")
    .replace(/[“”„"]/g, " ")
    .replace(/[.,!?;:()\[\]–—…]/g, " ")
    .replace(/\s+/g, " ").trim();
}
const EXP = [
  [/\bdoesn't\b/g, "does not"], [/\bdon't\b/g, "do not"], [/\bisn't\b/g, "is not"], [/\baren't\b/g, "are not"],
  [/\bcan't\b/g, "cannot"], [/\bwon't\b/g, "will not"], [/\bdidn't\b/g, "did not"], [/\bwasn't\b/g, "was not"],
  [/\bweren't\b/g, "were not"], [/\bhaven't\b/g, "have not"], [/\bhasn't\b/g, "has not"],
  [/\bi'm\b/g, "i am"], [/\b(you|we|they)'re\b/g, "$1 are"],
  [/\b(he|she|it|that|there|what|who|somebody|someone|everybody|everyone|nobody)'s\b/g, "$1 is"],
  [/\b([a-z]+)'s (not|[a-z]+ing)\b/g, "$1 is $2"],
  [/(^|\s)'m\b/g, "$1am"], [/(^|\s)'re\b/g, "$1are"], [/(^|\s)'s\b/g, "$1is"],
  [/\bcan not\b/g, "cannot"]
];
function full(s) {
  let x = base(s);
  for (const [r, v] of EXP) x = x.replace(r, v);
  x = x.replace(/(^|\s)'+/g, "$1").replace(/'+(?=\s|$)/g, "");
  return x.replace(/\s+/g, " ").trim();
}
function noApos(x) {
  return x.replace(/\bdoesnt\b/g, "does not").replace(/\bdont\b/g, "do not").replace(/\bisnt\b/g, "is not")
    .replace(/\barent\b/g, "are not").replace(/\bim\b/g, "i am");
}
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function keepOrder(q) { return q.o === NVA || q.o.every(x => /^\d+$/.test(x)); }
function lev(a, b) {
  const m = a.length, n = b.length; let p = Array.from({length: n + 1}, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const c = [i];
    for (let j = 1; j <= n; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    p = c;
  }
  return p[n];
}

function filled(q, ans) { return q.s.replace(/\s*\([^)]*\)/g, "").replace("___", ans); }
function fillVariants(q, ans) {
  const out = [ans];
  const pre = q.s.split("___")[0];
  const clause = (pre.match(/[^.!?]*$/) || [""])[0];
  out.push(pre + " " + ans, clause + " " + ans, clause.split(",").pop() + " " + ans);
  const sent = filled(q, ans);
  out.push(sent);
  const parts = q.s.replace(/\s*\([^)]*\)/g, "").match(/[^.!?]+[.!?]*/g) || [];
  const withBlank = parts.find(p => p.indexOf("___") >= 0);
  if (withBlank) out.push(withBlank.replace("___", ans));

}
const STOP = ["and", "the", "a", "an", "is", "are", "am", "it", "its"];
function wordsOf(s) { return base(s).replace(/'s\b/g, "").replace(/'/g, "").split(/[\s\/&+]+/).filter(w => w && STOP.indexOf(w) < 0); }
function stem(w) { return w.length > 3 && w.slice(-1) === "s" ? w.slice(0, -1) : w; }

function checkPos(q, raw) {
  const x = base(raw).replace(/^(it is|it's|its|this is|is)\s+/, "").replace(/^(a|an|the)\s+/, "").trim();
  const t = q.a[0];
  const syn = {noun: ["noun", "nouns", "n"], verb: ["verb", "verbs", "v"], adjective: ["adjective", "adjectives", "adj"]};

  if (x.length > 2 && lev(x, t) <= (t === "adjective" ? 2 : 1)) return {st: "almost", note: "Check your spelling: " + t + "."};

  const extra = [];

  if (!missing.length && !extra.length) return {st: "correct"};
  const parts = [];
  if (missing.length) parts.push("You missed: " + missing.join(", ") + ".");

// g = the student's sentence, w = the answer-key sentence (both already full())
function hintFor(q, g, w) {
  g = " " + g + " "; w = " " + w + " ";
  const ing = / (am|is|are) (not )?[a-z]+ing /;
  if (/ does not [a-z]+s /.test(g) && !/ does not [a-z]+s /.test(w)) return "After doesn't, the verb has no -s.";
  if (/ do not /.test(g) && / does not /.test(w)) return "With he, she and it we use doesn't.";
  if (/ does not /.test(g) && / do not /.test(w)) return "With I, you, we and they we use don't.";
  if (/ (do|does) not /.test(g) && / (am|is|are) not /.test(w)) return "With the verb be we don't use don't or doesn't. Use am not, isn't or aren't.";
  if (q.t === "stative" && ing.test(g) && !ing.test(w)) return "Stative verbs don't take -ing. Use the Present Simple.";
  if (ing.test(w) && !ing.test(g)) return "It is happening now: use am / is / are + verb-ing.";

// the part of a typed sentence that goes in the blank
function blankPart(q, got) {
  const s = full(filled(q, "§")).split("§");
  const pre = (s[0] || "").trim(), post = (s[1] || "").trim();
  let x = got;
  if (pre && x.indexOf(pre + " ") === 0) x = x.slice(pre.length + 1);
  if (post && x.length > post.length && x.slice(-(post.length + 1)) === " " + post) x = x.slice(0, -(post.length + 1));

}

  const h = hintFor(q, sg, full(filled(q, q.a[0])));
  if (h) return h;

  if (exp === b + "s" || exp === b + "es" || (exp.slice(-3) === "ies" && b === exp.slice(0, -3) + "y")) return "With he, she and it, add -s (or -es / -ies).";

function checkWriting(q, text) {

  if (q.k === "find") return checkFind(q, raw);
  const got = full(raw);
  const forms = a => q.k === "fill" ? fillVariants(q, a) : [a];
  const want = [];
  q.a.forEach(a => forms(a).forEach(v => want.push(full(v))));
  if (want.indexOf(got) >= 0) return {st: "correct"};
  for (const pair of (q.al || [])) {
    if (forms(pair[0]).map(full).indexOf(got) >= 0) return {st: "almost", note: pair[1]};
  }
  const na = noApos(got);
  if (na !== got && want.indexOf(na) >= 0) return {st: "almost", note: "Don't forget the apostrophe: don't, doesn't, isn't, aren't, I'm."};
  let note = "";
  if (q.k === "fill") note = fillHint(q, got);
  else if (q.k === "neg" && !/\b(not|never)\b/.test(got)) note = "Make the sentence negative: use don't / doesn't, or am not / isn't / aren't.";
  else if (q.k === "fix" && got === full(q.s)) note = "This is the same sentence. Find the mistake and fix it.";
  else if (q.k === "neg" || q.k === "fix") note = hintFor(q, got, full(q.a[0]));

}

function pool(t, kind, set) { return (kind === "mcq" ? MCQ : WR).filter(q => q.t === t && q.set === set); }

}

  if (a.st !== "wrong" || ["fill", "neg", "fix", "order"].indexOf(q.k) < 0 || !a.text || !ai.fn || ai.denied) return "";
  if (a.ai2 === "checking") return `<p class="aiby">Asking the AI teacher<span class="load" aria-hidden="true"><i></i><i></i><i></i></span></p>`;
  if (a.ai2 === "no") return `<p class="aiby">${ICON.spark} AI teacher: ${esc(a.ai2fb || "The answer key is right this time.")}</p>`;
  if (a.ai2 === "err") return `<p class="aiby">The AI teacher couldn't check this right now.</p>`;
  return `<button class="linkbtn" data-act="ai2" data-id="${q.id}">Think your answer is also right? Ask the AI teacher</button>`;
}
function grade(s, n) {
  return `<div class="grade" role="img" aria-label="Score: ${s} out of ${n}"><svg viewBox="0 0 220 140" aria-hidden="true"><path d="M60 30C110 10 190 18 202 58C214 98 160 128 104 126C48 124 12 98 16 66C20 40 52 22 96 20" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg><span>${s}/${n}</span></div>`;
}
function endMsg(r) {
  if (r >= 0.9) return ["Excellent!", "You really know this topic."];
  if (r >= 0.75) return ["Very good!", "Read your mistakes below, then try again."];
  if (r >= 0.5) return ["Good start", "Read your mistakes and the Learn page, then try again."];
  return ["Keep going", "Read the Learn page again, then try again. You can do it!"];
}
function vRunEnd(c) {
  const n = c.ids.length, s = score(c), m = endMsg(s / n);
  const wrong = c.ids.filter(id => !isOk(c.ans[id]));
  const other = c.kind === "mcq" ? ["wr", "Practice writing"] : ["mcq", "Practice multiple choice"];
  return `<section class="end">${grade(s, n)}
    <h2 class="verdict">${m[0]}</h2><p class="endmsg">${m[1]}</p>
    <div class="row"><button class="btn big" data-act="again">Try again</button><button class="btn big ghost" data-act="tab" data-tab="${other[0]}">${other[1]}</button></div>
    ${wrong.length ? `<h3 class="h3">Your mistakes</h3>${wrong.map(id => vReview(BYID[id], c.ans[id], 0)).join("")}` : ""}
  </section>`;
}
function vReview(q, a, num) {
  const ok = isOk(a), st = ok ? (a.st === "almost" ? "almost" : "correct") : "wrong";
  let yours, right;
  if (q.o) { yours = a && a.pick != null ? esc(q.o[a.pick]) : "<i>No answer</i>"; right = esc(q.o[q.a]); }
  else { yours = a && a.text && a.text.trim() ? esc(a.text) : "<i>No answer</i>"; right = q.k === "free" ? esc(q.m) : rightAns(q); }
  const head = st === "correct" ? ICON.check + " Correct" : st === "almost" ? ICON.bang + " Almost" : ICON.x + " Not quite";
  return `<article class="ritem">
    <p class="rtop"><span>${num ? "Question " + num + ": " : ""}${esc(TOPICS[q.t].title)}</span><span class="rst ${st}">${head}</span></p>
    ${q.k === "free" ? `<p class="rs">${md(q.q)}</p>` : ""}
    ${q.s && q.k !== "order" ? `<p class="rs">${md(q.s)}</p>` : ""}
    ${q.w ? `<p class="rs">${q.w.map(esc).join(" / ")}</p>` : ""}
    ${q.k === "free" ? "" : `<p class="rq">${md(qText(q))}</p>`}
    <p class="ra">Your answer: <b>${yours}</b></p>
    ${st !== "correct" ? `<p class="ra">${q.k === "free" ? "Example answer" : "Correct answer"}: <b>${right}</b></p>` : ""}
    ${a && a.note ? `<p class="ra note">${esc(a.note)}</p>` : ""}
    ${a && a.fb ? `<p class="ra">${esc(a.fb)}</p>` : ""}
    ${q.e ? `<p class="exp">${md(q.e)}</p>` : ""}
    ${q.o ? "" : ai2Block(q, a)}
  </article>`;
}

function vTest() {
  const T = S.test;
  let body;
  if (T.i < 0) body = vTestIntro(T);
  else if (T.done) body = T.view === "review" ? vTestReview(T) : vTestResult(T);
  else body = vTestQ(T);
  return bar("t-test", "Final test") + `<main class="wrap">${body}</main>`;
}
function vTestIntro(T) {
  const n = T.ids.length;
  return `<section class="card intro mt"><p class="qbig">Ready?</p><ul>
    <li>${n} questions. Part A: ${T.nm} multiple choice. Part B: ${n - T.nm} writing.</li>
    <li>Like a real test, you see the answers only at the end.</li>
    <li>You can go back, skip a question and change your answers before you finish.</li>
    <li>Write full words and check your spelling.</li></ul>
    <button class="btn big pen" data-act="test-start">Start ${ICON.arrow}</button></section>`;
}
function vTestQ(T) {
  const id = T.ids[T.i], q = BYID[id], n = T.ids.length, last = T.i === n - 1;
  const part = T.i < T.nm ? "Part A: Multiple choice" : "Part B: Writing";
  return `<div class="prog"><span>${part}</span><span>Question ${T.i + 1} of ${n}</span></div>
    <div class="pbar"><i style="width:${(100 * T.i / n).toFixed(1)}%"></i></div>
    ${q.o ? vMcq(q, T, "test") : vWr(q, T, "test")}
    <div class="tnav"><button class="btn ghost" data-act="tprev"${T.i === 0 ? " disabled" : ""}>${ICON.back} Back</button>
    ${last ? `<button class="btn pen" id="tnext" data-act="tfinish">Finish the test</button>` : `<button class="btn" id="tnext" data-act="tnext">Next ${ICON.arrow}</button>`}</div>
    ${T.warn ? `<div class="fb warn" role="status"><p class="fbh">${ICON.bang} ${esc(T.warn)}</p><p>Go back and answer, or <button class="linkbtn" data-act="tfinish" data-force="1">finish anyway</button></p></div>` : ""}
    <p class="lbl mt">Jump to a question</p>
    <div class="dots">${T.ids.map((x, k) => `<button class="dot${k === T.i ? " cur" : ""}${answered(T, x) ? " done" : ""}" data-act="tgo" data-k="${k}" aria-label="Question ${k + 1}${answered(T, x) ? ", answered" : ""}">${k + 1}</button>`).join("")}</div>`;
}
function vTestResult(T) {
  const st = stats(T), r = st.s / st.n;
  const v = r >= 0.85 ? ["You're ready!", "Great work. Read your few mistakes and you're all set for tomorrow."]
    : r >= 0.7 ? ["Almost ready", "Practice the topics marked below, then take a new test."]
    : ["Not ready yet", "That's OK! Go over the topics marked below and try a new test."];
  const rows = TORDER.map(t => {
    const s = st.by[t][0], n = st.by[t][1], p = n ? s / n : 0;
    const lab = p >= 0.85 ? ["Strong", "ok"] : p >= 0.6 ? ["Review", "warn"] : ["Practice more", "bad"];
    return `<div class="tres"><span class="tn">${esc(TOPICS[t].title)}<span class="tag ${lab[1]}">${lab[0]}</span></span><span class="tv">${s}/${n}</span>
      <div class="meter"><i class="${lab[1]}" style="width:${Math.round(100 * p)}%"></i></div>
      ${p < 0.85 ? `<button class="btn small ghost" data-act="topic" data-t="${t}" data-tab="learn">Practice this topic ${ICON.arrow}</button>` : ""}</div>`;
  }).join("");
  return `<section class="end">${grade(st.s, st.n)}<p class="pct">${Math.round(100 * r)}%</p>
    <h2 class="verdict">${v[0]}</h2><p class="endmsg">${v[1]}</p>
    <div>${rows}</div>
    <div class="row"><button class="btn big" data-act="treview">Review all answers</button><button class="btn big pen" data-act="test-new">Take a new test</button></div></section>`;
}
function vTestReview(T) {
  const items = T.ids.filter(id => !S.onlyWrong || !isOk(T.ans[id]));
  return `<div class="row"><button class="btn ghost" data-act="tresult">${ICON.back} Back to my score</button></div>
    <div class="filter"><button class="linkbtn" data-act="onlywrong">${S.onlyWrong ? "Show all questions" : "Show only my mistakes"}</button></div>
    ${items.length ? items.map(id => vReview(BYID[id], T.ans[id], T.ids.indexOf(id) + 1)).join("") : `<p class="center">No mistakes at all!</p>`}
    <div class="row"><button class="btn big pen" data-act="test-new">Take a new test</button></div><p class="mt"></p>`;
}

// ---------- actions ----------
function toTop() { try { window.scrollTo(0, 0); } catch (e) {} }
function showFb() {
  const el = app.querySelector(".next") || app.querySelector(".self");
  if (el && el.scrollIntoView) { try { el.scrollIntoView({block: "nearest", behavior: "smooth"}); } catch (e) { el.scrollIntoView(false); } }
}
function focusIn(id) { const el = document.getElementById("in-" + id); if (el) { try { el.focus(); } catch (e) {} } }
function pick(id, o) {
  const c = ctx(), q = BYID[id];
  if (!q || !c) return;
  if (S.v === "test") { if (!c.done) { c.ans[id] = {pick: o}; c.warn = ""; render(); } return; }
  if (c.ans[id]) return;
  c.ans[id] = {pick: o, ok: o === q.a};
  render(); showFb();
}
function check(id) {
  const c = ctx(), q = BYID[id];
  const el = document.getElementById("in-" + id);
  const text = el ? el.value : (S.drafts[id] || "");
  S.drafts[id] = text;
  if (!text.trim()) { const m = document.getElementById("msg-" + id); if (m) m.textContent = "Write your answer first."; focusIn(id); return; }
  if (q.k !== "free") { c.ans[id] = Object.assign({text: text}, checkWriting(q, text)); render(); showFb(); return; }
  c.ans[id] = {text: text, st: "checking"};
  render();
  aiFree(q, text).then(res => {
    if (c.ans[id] && c.ans[id].st === "checking") { c.ans[id] = Object.assign({text: text}, res); render(); showFb(); }
  });
}
function next() {
  const c = ctx();
  if (c.i < c.ids.length - 1) c.i++;
  else {
    c.done = true;
    const s = score(c), n = c.ids.length, k = c.t + ":" + c.kind, b = P.best[k];
    if (!b || s / n > b[0] / b[1]) { P.best[k] = [s, n]; saveP(); }
  }
  render(); toTop();
}
function chip(id, w) {
  const el = document.getElementById("in-" + id);
  if (!el || el.readOnly) return;
  const cur = el.value.replace(/\s+$/, "");
  el.value = cur ? cur + " " + w : w.charAt(0).toUpperCase() + w.slice(1);
  S.drafts[id] = el.value; saveSoon();
}
function commitDraft(T) {
  if (!T || T.i < 0 || T.done) return;
  const id = T.ids[T.i], q = BYID[id];
  if (!q || q.o) return;
  const el = document.getElementById("in-" + id);
  const v = el ? el.value : (S.drafts[id] || "");
  S.drafts[id] = v; T.ans[id] = {text: v};
}
function finishTest(force) {
  const T = S.test;
  commitDraft(T);
  const miss = T.ids.filter(id => !answered(T, id)).length;
  if (miss && !force) { T.warn = miss === 1 ? "1 question has no answer." : miss + " questions have no answer."; render(); showWarn(); return; }
  T.ids.forEach(id => {
    const q = BYID[id], a = T.ans[id] || {};
    if (q.o) T.ans[id] = {pick: a.pick, ok: a.pick === q.a};
    else { const text = a.text != null ? a.text : (S.drafts[id] || ""); T.ans[id] = Object.assign({text: text}, checkWriting(q, text)); }
  });
  T.done = true; T.view = "result"; T.warn = "";
  const st = stats(T);
  P.tests.unshift({uid: T.uid, at: Date.now(), s: st.s, n: st.n, by: st.by});
  P.tests = P.tests.slice(0, 5); saveP();
  render(); toTop();
}
function showWarn() { const el = app.querySelector(".fb.warn"); if (el && el.scrollIntoView) { try { el.scrollIntoView({block: "nearest", behavior: "smooth"}); } catch (e) {} } }
function act(a, d) {
  const T = S.test;
  switch (a) {
    case "home": S.v = "home"; break;
    case "topic": S.v = "topic"; S.t = d.t; S.tab = d.tab || "learn"; break;
    case "tab": S.tab = d.tab; break;
    case "cheat": S.v = "cheat"; break;
    case "pick": pick(d.id, +d.o); return;
    case "check": check(d.id); return;
    case "next": next(); return;
    case "again": { const c = ctx(); S.runs[c.t + ":" + c.kind] = newRun(c.t, c.kind); break; }
    case "self": { const c = ctx(), x = c.ans[d.id]; if (x) { x.st = d.ok === "1" ? "correct" : "wrong"; x.by = "self"; } render(); showFb(); return; }
    case "retry": { const c = ctx(), x = c.ans[d.id]; if (x) { S.drafts[d.id] = x.text; delete c.ans[d.id]; } render(); focusIn(d.id); return; }
    case "ai2": second(d.id); return;
    case "chip": chip(d.id, d.w); return;
    case "clear": { const el = document.getElementById("in-" + d.id); if (el) el.value = ""; S.drafts[d.id] = ""; saveSoon(); return; }
    case "test-new": S.test = newTest(); S.v = "test"; S.onlyWrong = false; break;
    case "test-go": S.v = "test"; break;
    case "test-start": T.i = 0; break;
    case "tnext": commitDraft(T); T.warn = ""; T.i = Math.min(T.i + 1, T.ids.length - 1); break;
    case "tprev": commitDraft(T); T.warn = ""; T.i = Math.max(T.i - 1, 0); break;
    case "tgo": commitDraft(T); T.warn = ""; T.i = Math.max(0, Math.min(+d.k, T.ids.length - 1)); break;
    case "tfinish": finishTest(d.force === "1"); return;
    case "treview": T.view = "review"; break;
    case "tresult": T.view = "result"; break;
    case "onlywrong": S.onlyWrong = !S.onlyWrong; render(); return;
    default: return;
  }
  render(); toTop();
}
document.addEventListener("click", ev => {
  const el = ev.target && ev.target.closest ? ev.target.closest("[data-act]") : null;
  if (!el || el.disabled) return;
  act(el.getAttribute("data-act"), el.dataset);
});
document.addEventListener("input", ev => {
  const el = ev.target;
  if (el && el.dataset && el.dataset.draft) { S.drafts[el.dataset.draft] = el.value; saveSoon(); }
});
document.addEventListener("keydown", ev => {
  const el = ev.target;
  if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing && el && el.dataset && el.dataset.enter) {
    ev.preventDefault();
    const b = document.getElementById(el.dataset.enter);
    if (b && !b.disabled) b.click();
  }
});

// ---------- the AI teacher (only where this page can ask Claude) ----------
const ai = {fn: null, denied: false};
let sampleP = null;
function getSample() {
  if (!sampleP) {
    sampleP = new Promise(res => {
      let done = false;
      const fin = v => { if (!done) { done = true; res(v || null); } };
      try {
        if (!window.claude || typeof window.claude.use !== "function") { fin(null); return; }
        setTimeout(() => fin(null), 12000);
        Promise.resolve(window.claude.use("sample")).then(fin, () => fin(null));
      } catch (e) { fin(null); }
    }).then(fn => { ai.fn = fn; return fn; });
  }
  return sampleP;
}
const RULES = "Class rules: Present Simple for habits and facts (he/she/it + -s/-es/-ies; negative: don't/doesn't + base verb). The verb be: am/is/are, negative am not/isn't/aren't (never don't with be). Present Progressive = am/is/are + verb-ing for things happening now. Stative verbs (think = have an opinion, feel, understand, believe, know, like, love, hate, want, need) stay in the Present Simple, even with now; 'think about' (= considering right now) can be in the Present Progressive. Adjectives come before the noun or after be, and never take -s.";
function promptFree(q, text) {
  return "You are a kind, encouraging English teacher checking a 7th-grade student's writing (English level A2, Israel).\n" +
    "Task: " + q.q + "\nWhat the task practices: " + q.g + ".\n" + RULES + "\n" +
    "Student's answer: \"\"\"" + String(text).slice(0, 600) + "\"\"\"\n" +
    "Check the grammar and spelling, and check that the student did what the task asks. Don't take points off for a missing capital letter or full stop (you may mention it). Only judge the English, not the student's ideas.\n" +
    "Reply with JSON only, exactly in this shape: {\"verdict\":\"correct\",\"feedback\":\"...\",\"corrected\":\"...\"}\n" +
    "verdict: \"correct\" = good English and the task is done; \"almost\" = one small mistake; \"incorrect\" = the main grammar point is wrong or the task was not done.\n" +
    "feedback: 1 to 3 short sentences in very simple English, talking to the student as \"you\".\n" +
    "corrected: the student's answer with the mistakes fixed (the same text if it is already correct).";
}
function promptSecond(q, text) {
  return "You are an English teacher checking a 7th-grade student's exercise (English level A2, Israel).\n" +
    "Exercise: " + qText(q) + "\n" + (q.s ? "Sentence: " + q.s.replace(/\*\*/g, "") + "\n" : "") + (q.w ? "Words: " + q.w.join(" / ") + "\n" : "") +
    "Answer key: " + q.a.join("  OR  ") + "\nStudent's answer: \"\"\"" + String(text).slice(0, 400) + "\"\"\"\n" + RULES + "\n" +
    "The student's answer is different from the answer key. Is it ALSO a fully correct answer to this exercise? Be strict about grammar and spelling (verb endings -s/-es/-ies, -ing spelling, don't/doesn't, am/is/are) and about what the exercise asks: for example, it must be negative if the exercise asks for the negative, and it must keep the meaning of the original sentence. Ignore capital letters and the full stop.\n" +
    "Reply with JSON only: {\"correct\": true or false, \"feedback\": \"1 or 2 short sentences in simple English for the student\"}";
}
async function askJSON(prompt) {
  const fn = await getSample();
  if (!fn) throw {code: "unavailable"};
  const opts = {modelTier: "default"};
  let v = typeof fn.json === "function" ? await fn.json(prompt, opts) : await fn(prompt, opts);
  if (v && typeof v === "object" && !("verdict" in v) && !("correct" in v)) {
    if (v.value && typeof v.value === "object") v = v.value;
    else if (typeof v.text === "string") v = v.text;
  }
  if (typeof v === "string") { const m = v.match(/\{[\s\S]*\}/); v = m ? JSON.parse(m[0]) : null; }
  if (!v || typeof v !== "object") throw {code: "bad"};
  return v;
}
async function aiFree(q, text) {
  if (ai.denied) return {st: "self", why: ""};
  try {
    const v = await askJSON(promptFree(q, text));
    const verdict = String(v.verdict || "").toLowerCase();
    return {st: verdict === "correct" ? "correct" : verdict === "almost" ? "almost" : "wrong", by: "ai", fb: String(v.feedback || ""), fix: String(v.corrected || "")};
  } catch (e) {
    const code = e && e.code;
    if (code === "not_granted") ai.denied = true;
    return {st: "self", why: code === "rate_limited" ? "busy" : (code === "unavailable" || code === "not_granted") ? "" : "err"};
  }
}
async function second(id) {
  const c = ctx(), q = BYID[id], a = c && c.ans[id];
  if (!a || a.ai2 === "checking") return;
  a.ai2 = "checking"; render();
  try {
    const v = await askJSON(promptSecond(q, a.text));
    const yes = v.correct === true || String(v.correct).toLowerCase() === "true";
    a.ai2 = yes ? "yes" : "no"; a.ai2fb = String(v.feedback || "");
    if (yes) {
      a.st = "correct"; a.note = ""; a.by = "ai";
      if (c === S.test) { const st = stats(c); const h = P.tests.filter(x => x.uid === c.uid)[0]; if (h) { h.s = st.s; h.by = st.by; saveP(); } }
    }
  } catch (e) { if (e && e.code === "not_granted") ai.denied = true; a.ai2 = "err"; }
  render();
}

// ---------- start ----------
function boot(data) {
  let st = data && data.v ? data : null;
  if (!st) { const saved = load(KEY + "-state"); if (saved && saved.S && Date.now() - saved.at < 12 * 3600e3) st = saved.S; }
  if (st && validState(st)) S = Object.assign(S, st);
  if (S.v === "test" && !S.test) S.v = "home";
  render();
  getSample().then(() => { const ae = document.activeElement; if (!ae || !/INPUT|TEXTAREA/.test(ae.tagName)) render(); });
}
try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => S); } catch (e) {}
try {
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
  else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
} catch (e) { boot({}); }

})();
</script>
</body>
